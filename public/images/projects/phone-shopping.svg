<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="psGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="600" fill="url(#psBg)"/>

  <!-- Radial Glow Behind Storefront Devices -->
  <circle cx="480" cy="300" r="280" fill="url(#psGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#e0f2fe" stroke-opacity="0.08" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="840" y1="0" x2="840" y2="600"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
  </g>

  <!-- Left: Stylized Smartphone Device Outline -->
  <rect x="220" y="110" width="220" height="380" rx="36" fill="#082f49" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <!-- Phone Screen Inner Area -->
  <rect x="235" y="130" width="190" height="340" rx="24" fill="#0c4a6e" fill-opacity="0.5"/>
  <!-- Dynamic Island Notch -->
  <rect x="295" y="142" width="70" height="14" rx="7" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.4"/>
  <!-- Device Screen Product Hero Preview -->
  <rect x="255" y="175" width="150" height="110" rx="14" fill="#0284c7" fill-opacity="0.25" stroke="#7dd3fc" stroke-opacity="0.3"/>
  <circle cx="330" cy="225" r="28" fill="#38bdf8" fill-opacity="0.25"/>
  <rect x="255" y="300" width="110" height="10" rx="5" fill="#f0f9ff" opacity="0.9"/>
  <rect x="255" y="320" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="255" y="345" width="150" height="32" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <text x="330" y="365" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">ADD TO CART</text>

  <!-- Right: Shopping Cart and Catalog Cards -->
  <rect x="490" y="130" width="260" height="150" rx="18" fill="#082f49" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Shopping Cart Icon in Header -->
  <path d="M520 165 L535 165 L548 205 L590 205 L600 175 L540 175" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="555" cy="216" r="4.5" fill="#7dd3fc"/>
  <circle cx="583" cy="216" r="4.5" fill="#7dd3fc"/>
  <text x="618" y="185" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Shopping Cart</text>
  <text x="618" y="205" fill="#7dd3fc" font-family="sans-serif" font-size="11" opacity="0.8">Instant Checkout</text>

  <!-- Catalog Grid Items -->
  <rect x="490" y="300" width="120" height="150" rx="14" fill="#0c4a6e" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.25"/>
  <circle cx="550" cy="345" r="22" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="506" y="385" width="88" height="8" rx="4" fill="#f0f9ff" opacity="0.8"/>
  <rect x="506" y="405" width="55" height="8" rx="4" fill="#7dd3fc" opacity="0.7"/>

  <rect x="630" y="300" width="120" height="150" rx="14" fill="#0c4a6e" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.25"/>
  <circle cx="690" cy="345" r="22" fill="#38bdf8" fill-opacity="0.2"/>
  <rect x="646" y="385" width="88" height="8" rx="4" fill="#f0f9ff" opacity="0.8"/>
  <rect x="646" y="405" width="55" height="8" rx="4" fill="#7dd3fc" opacity="0.7"/>

  <!-- Bottom Badge: Tech Stack and E-Commerce Status -->
  <rect x="320" y="505" width="320" height="34" rx="17" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="480" y="527" fill="#e0f2fe" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">RESPONSIVE E-COMMERCE • STORE & CART</text>
</svg>

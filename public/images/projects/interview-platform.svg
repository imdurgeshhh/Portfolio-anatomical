<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="600" fill="url(#bgGrad)"/>

  <!-- Radial Glow Behind Editor -->
  <circle cx="480" cy="300" r="280" fill="url(#nodeGlow)"/>

  <!-- Subtle Matrix Grid -->
  <g stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="440" y1="0" x2="440" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="680" y1="0" x2="680" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="0" y1="500" x2="960" y2="500"/>
  </g>

  <!-- Code Editor Window Frame -->
  <rect x="180" y="110" width="600" height="380" rx="16" fill="#090d16" fill-opacity="0.75" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="180" y="110" width="600" height="42" rx="16" fill="#1e1b4b" fill-opacity="0.6"/>
  <line x1="180" y1="152" x2="780" y2="152" stroke="#818cf8" stroke-opacity="0.2"/>

  <!-- Editor Window Controls -->
  <circle cx="212" cy="131" r="5.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="230" cy="131" r="5.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="248" cy="131" r="5.5" fill="#34d399" opacity="0.8"/>

  <!-- WebRTC Status Indicator Badge -->
  <rect x="630" y="122" width="130" height="20" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
  <circle cx="645" cy="132" r="3.5" fill="#22c55e"/>
  <text x="656" y="136" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">WebRTC LIVE</text>

  <!-- Code Line Visuals -->
  <g fill="#94a3b8" opacity="0.35">
    <rect x="220" y="180" width="140" height="8" rx="4"/>
    <rect x="240" y="205" width="220" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
    <rect x="240" y="230" width="180" height="8" rx="4"/>
    <rect x="260" y="255" width="280" height="8" rx="4" fill="#818cf8" opacity="0.7"/>
    <rect x="260" y="280" width="160" height="8" rx="4"/>
    <rect x="240" y="305" width="120" height="8" rx="4"/>
    <rect x="220" y="330" width="90" height="8" rx="4"/>
  </g>

  <!-- Dual Video Call Feeds (Interviewer & Candidate) -->
  <rect x="580" y="180" width="170" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="665" cy="225" r="22" fill="#38bdf8" opacity="0.2"/>
  <path d="M645 270 C645 250 685 250 685 270" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.6"/>
  <text x="592" y="292" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">Candidate Video</text>

  <rect x="580" y="320" width="170" height="120" rx="10" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="665" cy="365" r="22" fill="#818cf8" opacity="0.2"/>
  <path d="M645 410 C645 390 685 390 685 410" stroke="#818cf8" stroke-width="2.5" fill="none" opacity="0.6"/>
  <text x="592" y="432" fill="#818cf8" font-family="monospace" font-size="9" opacity="0.8">Interviewer Video</text>

  <!-- Live Pulse Waveforms -->
  <path d="M220 390 L260 390 L280 370 L300 410 L320 380 L340 390 L480 390" stroke="url(#lineGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Centered Floating Monaco Icon / Badge -->
  <rect x="330" y="440" width="300" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.4"/>
  <text x="480" y="461" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">MONACO EDITOR • SPRING BOOT • WEBRTC</text>
</svg>
